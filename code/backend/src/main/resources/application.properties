spring.application.name=backend

# Database (Supabase PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Server
server.port=8080

# Admin bootstrap: set ADMIN_EMAIL in the environment to the email of an already
# registered user; on startup that user is promoted to ADMIN. Leave unset for none.
admin.bootstrap-email=${ADMIN_EMAIL:}

# Include exception messages in error responses (needed for 4xx error details)
server.error.include-message=always
