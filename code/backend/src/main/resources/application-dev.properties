# =============================================================================
# DEV / PREVIEW PROFILE  (activate with:  --spring.profiles.active=dev)
#
# Purpose: run the full app locally for a VISUAL PREVIEW when the real
# PostgreSQL / Supabase database is unavailable. This profile uses an in-memory
# H2 database that lives only for the life of the process — nothing is written
# to, read from, or able to reach your Supabase database. No .env is required.
#
# This profile does NOT weaken authentication: real BCrypt password hashing and
# real JWT signing/verification are still used. It only swaps the database and
# seeds clearly-labelled DEMO data (see DevDataSeeder).
#
# The default (production) profile is unchanged and still requires the real
# DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET.
# =============================================================================

# In-memory H2 in PostgreSQL-compatibility mode (overrides the Supabase settings)
spring.datasource.url=jdbc:h2:mem:milestonemetrics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Hibernate auto-detect the H2 dialect (override the hardcoded Postgres one)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Browsable DB console at http://localhost:8080/h2-console (dev only)
spring.h2.console.enabled=true

# Dev-only JWT secret so no JWT_SECRET env var is needed for preview.
# (Not a production secret — the production profile still uses ${JWT_SECRET}.)
jwt.secret=dev-only-preview-secret-not-for-production-use-0123456789abcdef
jwt.expiration=86400000

# No admin bootstrap by env in dev — DevDataSeeder creates the demo admin directly.
admin.bootstrap-email=
